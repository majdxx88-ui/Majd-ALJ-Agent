<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المستشار المالي - عبد اللطيف جميل</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 90%; max-width: 400px; background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; height: 80vh; }
        .header { background-color: #4b0082; color: white; padding: 20px; text-align: center; }
        .header h2 { margin: 0; font-size: 1.2rem; }
        .header span { font-size: 0.8rem; opacity: 0.8; }
        #chat-history { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 15px; border-radius: 10px; max-width: 80%; line-height: 1.4; font-size: 0.9rem; }
        .user-message { background-color: #e6e6e6; color: #333; align-self: flex-start; border-bottom-right-radius: 0; }
        .bot-message { background-color: #4b0082; color: white; align-self: flex-end; border-bottom-left-radius: 0; }
        .input-area { display: flex; padding: 15px; border-top: 1px solid #eee; background: #fff; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; margin-left: 10px; }
        button { background-color: #4b0082; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        button:disabled { background-color: #ccc; }
        .loading { font-size: 0.8rem; color: #888; text-align: center; margin-top: 5px; display: none; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <h2>Abdul Latif Jameel</h2>
        <span>FINANCE AI AGENT</span>
    </div>
    <div id="chat-history">
        <div class="message bot-message">هلا بك يا غالي! أنا المساعد الذكي لمجد، آمرني؟</div>
    </div>
    <div class="loading" id="loading">جاري الكتابة...</div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="اكتب سؤالك هنا..." />
        <button id="send-btn">إرسال</button>
    </div>
</div>

<script type="module">
    import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

    // مفتاحك تم إضافته هنا
    const API_KEY = "AIzaSyDa4FV0EvTfM0fFiStfNNA_71amGH70yQk"; 

    const genAI = new GoogleGenerativeAI(API_KEY);
    const model = genAI.getGenerativeModel({ model: "gemini-pro"});

    const chatHistory = document.getElementById('chat-history');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const loading = document.getElementById('loading');

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage(text, 'user-message');
        userInput.value = '';
        loading.style.display = 'block';
        sendBtn.disabled = true;

        try {
            const result = await model.generateContent(text);
            const response = await result.response;
            const textResponse = response.text();
            appendMessage(textResponse, 'bot-message');
        } catch (error) {
            console.error(error);
            appendMessage("حدث خطأ بسيط، حاول مرة أخرى.", 'bot-message');
        } finally {
            loading.style.display = 'none';
            sendBtn.disabled = false;
        }
    }

    function appendMessage(text, className) {
        const div = document.createElement('div');
        div.className = `message ${className}`;
        div.innerText = text;
        chatHistory.appendChild(div);
        chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>

</body>
</html>
